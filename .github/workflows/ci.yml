name: CI

# On pull requests where the minutes are free (a public repository), on main as it moves, and on demand: gh workflow run CI --ref <branch>
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Third-party actions are pinned by commit, and every job can only read the repository
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp:
    if: github.event_name != 'pull_request' || !github.event.repository.private
    name: C++ ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-gcc, os: ubuntu-24.04, cc: gcc-13, cxx: g++-13, tests: ON, config: Release }
          - { name: linux-clang, os: ubuntu-24.04, cc: clang-18, cxx: clang++-18, tests: ON, config: Release }
          - { name: linux-gcc-debug, os: ubuntu-24.04, cc: gcc-13, cxx: g++-13, tests: ON, config: Debug }
          - { name: linux-gcc-dfloat, os: ubuntu-24.04, cc: gcc-13, cxx: g++-13, tests: ON, config: Release, extra: -DROVE_DFLOAT=ON }
          - { name: linux-clang-sanitizers, os: ubuntu-24.04, cc: clang-18, cxx: clang++-18, tests: ON, config: Debug, extra: "-DCMAKE_CXX_FLAGS=-fsanitize=address,undefined -fno-sanitize-recover=all" }
          - { name: macos, os: macos-15, cc: clang, cxx: clang++, tests: ON, config: Release }
          - { name: windows-msvc, os: windows-2022, cc: cl, cxx: cl, tests: ON, config: Release, extra: "-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake" }
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Boost.Test (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libboost-test-dev
      - name: Boost.Test (macOS)
        if: runner.os == 'macOS'
        run: brew install boost
      - name: Boost.Test (Windows)
        if: runner.os == 'Windows'
        run: C:/vcpkg/vcpkg install boost-test:x64-windows
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DROVE_TESTS=${{ matrix.tests }}
          -DCMAKE_C_COMPILER=${{ matrix.cc }} -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
          -DCMAKE_COMPILE_WARNING_AS_ERROR=ON "${{ matrix.extra }}"
      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --parallel
      - name: Test
        if: matrix.tests == 'ON'
        run: ctest --test-dir build --build-config ${{ matrix.config }} --output-on-failure
      - name: Install and use with find_package
        shell: bash
        run: |
          cmake --install build --config ${{ matrix.config }} --prefix "$RUNNER_TEMP/rove"
          mkdir -p "$RUNNER_TEMP/consumer"
          printf '#include <rove/vec.h>\nint main() { return rove::dot(rove::vec<3>(1, 0, 0), rove::vec<3>(1, 0, 0)) == 1 ? 0 : 1; }\n' > "$RUNNER_TEMP/consumer/main.cc"
          printf 'cmake_minimum_required(VERSION 3.15)\nproject(consumer CXX)\nfind_package(rove 3 CONFIG REQUIRED)\nadd_executable(consumer main.cc)\ntarget_link_libraries(consumer PRIVATE rove::rove)\n' > "$RUNNER_TEMP/consumer/CMakeLists.txt"
          cmake -S "$RUNNER_TEMP/consumer" -B "$RUNNER_TEMP/consumer/build" -DCMAKE_BUILD_TYPE=${{ matrix.config }} -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/rove" -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} "${{ matrix.extra }}"
          cmake --build "$RUNNER_TEMP/consumer/build" --config ${{ matrix.config }}
      - name: An install links with another compiler
        if: matrix.name == 'linux-gcc'
        shell: bash
        run: |
          cmake -S "$RUNNER_TEMP/consumer" -B "$RUNNER_TEMP/consumer/other" -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/rove" -DCMAKE_CXX_COMPILER=clang++-18
          cmake --build "$RUNNER_TEMP/consumer/other"

  python:
    if: github.event_name != 'pull_request' || !github.event.repository.private
    name: Python ${{ matrix.python }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2022]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: pip install ".[test]"
      - name: Test
        shell: bash
        run: cd "$RUNNER_TEMP" && python -m pytest -q -p no:cacheprovider "$GITHUB_WORKSPACE/tests"

  # The ways docs/install.md gives to use rove from C++, each building tests/test_conan_package/ against it
  consumers:
    if: github.event_name != 'pull_request' || !github.event.repository.private
    name: Use as ${{ matrix.way }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        way: [submodule, conan, vcpkg]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: rove
      - name: As a subdirectory (a submodule)
        if: matrix.way == 'submodule'
        run: |
          mkdir app && cp rove/tests/test_conan_package/example.cc app/
          printf 'cmake_minimum_required(VERSION 3.15)\nproject(app CXX)\nadd_subdirectory(../rove rove)\nadd_executable(rove_example example.cc)\ntarget_link_libraries(rove_example PRIVATE rove::rove)\n' > app/CMakeLists.txt
          cmake -S app -B app/build -DCMAKE_COMPILE_WARNING_AS_ERROR=ON
          cmake --build app/build
          app/build/rove_example
      - name: Conan
        if: matrix.way == 'conan'
        run: |
          pipx install conan
          conan profile detect
          conan create rove -s compiler.cppstd=20 --build=missing
      - name: The port's SHA512 is its release's
        if: matrix.way == 'vcpkg'
        working-directory: rove
        run: tests/check_port_hash.sh
      - name: vcpkg
        if: matrix.way == 'vcpkg'
        env:
          ROVE_SOURCE_DIR: ${{ github.workspace }}/rove
          VCPKG_KEEP_ENV_VARS: ROVE_SOURCE_DIR
        run: |
          mkdir app && cp rove/tests/test_conan_package/CMakeLists.txt rove/tests/test_conan_package/example.cc app/
          echo '{ "name": "app", "version": "0.0.0", "dependencies": ["rove"] }' > app/vcpkg.json
          cmake -S app -B app/build -DCMAKE_TOOLCHAIN_FILE=$VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake -DVCPKG_OVERLAY_PORTS=$PWD/rove/ports
          cmake --build app/build
          app/build/rove_example
